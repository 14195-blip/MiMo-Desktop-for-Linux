name: Build MiMo AI (Linux)

on:
  workflow_dispatch:
    inputs:
      exe_url:
        description: "Installer URL (change only if Xiaomi's CDN path changes)"
        required: false
        default: "https://mimocode-cdn.xiaomimimo.com/mimocode/mimodesktopai/XiaomiMiMo-AI-latest-x64-setup.exe"
      electron_version:
        description: "Force a specific Electron version (blank = auto-detect from the exe)"
        required: false
        default: ""
      make_release:
        description: "Publish a GitHub Release with the built artifacts"
        type: boolean
        required: false
        default: false

  # The upstream installer URL is a `-latest-` pointer, so a new Xiaomi build
  # can land at any time. Rebuild weekly to catch upstream breakage early.
  # Scheduled runs build, test and smoke-test only: `make_release` has no value
  # on a schedule event, so the release job is skipped and publishing stays an
  # explicit human decision. A failure here is the drift alarm.
  schedule:
    # Mondays 04:37 UTC — off the hour, when cron load is lightest.
    - cron: "37 4 * * 1"

jobs:
  # Fast gate: type-checks the script and runs its inline unit tests. Keeps
  # regressions in the packaging logic (platform filters, path handling)
  # from reaching a published .deb — the arm64 release shipped x86-64
  # natives because nothing checked the arch.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: "true"
          # There is no deno.lock in this repo, and setup-deno's cache key
          # defaults to hashing one. mimo-linux.ts is the only file whose
          # jsr:/npm: imports change the module graph, so key on that.
          cache-hash: ${{ hashFiles('mimo-linux.ts') }}
      - name: Inline tests (also type-checks)
        run: deno test -A mimo-linux.ts

  build:
    # No arm64 runner needed: we only download pre-built Electron zips and
    # npm native modules for the target arch, we don't compile anything.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v4

      - name: Install system tools
        run: |
          sudo apt-get update -y
          # p7zip-full is a transitional dummy package on Ubuntu 24.04+
          # ("noble", incl. ubuntu-latest) — it no longer installs a `7z`
          # binary, it just pulls in `7zip`, which installs `7zz` instead.
          # Install both (harmless if p7zip-full is a no-op) and symlink so
          # `7z` resolves either way, for tooling that expects it literally.
          sudo apt-get install -y p7zip-full 7zip curl unzip tar dpkg-dev
          if ! command -v 7z >/dev/null 2>&1 && command -v 7zz >/dev/null 2>&1; then
            sudo ln -sf "$(command -v 7zz)" /usr/local/bin/7z
          fi
          command -v 7z || command -v 7zz

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: "true"
          cache-hash: ${{ hashFiles('mimo-linux.ts') }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build ${{ matrix.arch }} (+ .deb)
        id: build
        env:
          # Empty on a `schedule` run (github.event.inputs only exists for
          # workflow_dispatch), so every input needs a shell-side default or
          # the scheduled build would pass --exe-url "" and die immediately.
          INPUT_EXE_URL: ${{ github.event.inputs.exe_url }}
          INPUT_ELECTRON: ${{ github.event.inputs.electron_version }}
        run: |
          set -euo pipefail
          EXE_URL="${INPUT_EXE_URL:-https://mimocode-cdn.xiaomimimo.com/mimocode/mimodesktopai/XiaomiMiMo-AI-latest-x64-setup.exe}"
          ELECTRON_VERSION="${INPUT_ELECTRON// /}"
          EXTRA_FLAGS=()
          if [ -n "$ELECTRON_VERSION" ]; then
            EXTRA_FLAGS+=(--electron "$ELECTRON_VERSION")
          fi
          deno run -A mimo-linux.ts \
            --exe-url "$EXE_URL" \
            --target-arch ${{ matrix.arch }} \
            --deb -y \
            "${EXTRA_FLAGS[@]}"
          # NB: the ~200 MB installer download is deliberately NOT cached.
          # Caching it would make every weekly run reuse the previous week's
          # .exe, and the whole point of the schedule is to notice when
          # upstream moves. Only the Deno module cache is reused.

      - name: Archive portable build
        run: |
          set -euo pipefail
          OUTDIR="$(find . -maxdepth 1 -type d -name "*-linux-${{ matrix.arch }}" -print -quit)"
          if [ -z "$OUTDIR" ]; then
            echo "no portable build directory found for ${{ matrix.arch }}" >&2
            exit 1
          fi
          tar -czf "$(basename "$OUTDIR").tar.gz" "$OUTDIR"

      - uses: actions/upload-artifact@v4
        with:
          name: mimo-ai-linux-${{ matrix.arch }}
          path: |
            *-linux-${{ matrix.arch }}.tar.gz
            *.deb
          if-no-files-found: error

  # Installs the real .deb in a clean container and checks the things that
  # have actually broken before: unresolvable Depends, missing CJK fonts, a
  # postinst that did not run, and a native module that will not load. The
  # build job cannot catch any of these — it only ever runs the packaging
  # script, never the app. x64 only: the runner is x86-64.
  smoke:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Only distros this build is actually verified on. Measured, not
        # assumed — see the "Runs where?" note in README.md:
        #   22.04  libasound2      1.2.6.1   works
        #   24.04  libasound2t64   1.2.11    FAILS
        #   25.04  libasound2t64             FAILS
        #   25.10  libasound2t64   1.2.14    works
        # 24.04 and 25.04 fail with
        #   undefined symbol: snd_device_name_get_hint, version ALSA_0.9
        # which is Electron 41 against Ubuntu's t64 libasound, not something
        # the packaging can fix. 24.10 is omitted: it is EOL and its repos
        # have moved to old-releases.ubuntu.com, so it cannot be tested.
        distro: ["ubuntu:22.04", "ubuntu:25.10"]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mimo-ai-linux-x64
          path: smoke

      - name: Install and launch
        run: |
          set -euo pipefail
          # The container script goes in as a *file*, not on stdin: `docker run`
          # only forwards stdin with -i, and without it `bash -s` reads nothing,
          # exits 0 and the whole smoke test passes without testing anything.
          cat > smoke.sh <<'SMOKE'
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          # A failure here IS the assertion: it means a Depends entry cannot
          # be satisfied on this distro.
          apt-get install -y -qq /artifacts/mimo.deb >/dev/null
          echo "--- installed ---"
          dpkg-query -W -f='${Status} ${Version}\n' mimo-desktop

          echo "--- launcher resolves through the /usr/bin symlink ---"
          command -v mimo-desktop

          echo "--- CJK font coverage (the app ships no fonts of its own) ---"
          fc=$(fc-match "sans-serif:lang=zh-cn" -f '%{file}\n')
          echo "zh-cn -> $fc"
          case "$fc" in
            *DejaVu*) echo "FAIL: CJK text would render as tofu"; exit 1 ;;
          esac

          echo "--- chrome-sandbox setuid (postinst ran) ---"
          if [ ! -u /opt/mimo-ai/chrome-sandbox ]; then
            echo "FAIL: chrome-sandbox is not setuid"
            stat -c '%A %U:%G' /opt/mimo-ai/chrome-sandbox
            exit 1
          fi
          stat -c '%A %U:%G' /opt/mimo-ai/chrome-sandbox

          # The assertion that matters most: the dynamic loader reports only
          # the FIRST library it cannot find, so a launch failure names one
          # missing .so at a time and the rest stay hidden. ldd lists them
          # all. This is what caught the undeclared libasound2/libcups2.
          echo "--- every shared library resolves ---"
          missing=$(ldd /opt/mimo-ai/electron | awk '/not found/{print $1}')
          if [ -n "$missing" ]; then
            echo "FAIL: undeclared shared libraries:"
            echo "$missing"
            echo "add the providing package(s) to DEB_DEPENDS in mimo-linux.ts"
            exit 1
          fi
          echo "all resolved"

          echo "--- environment (context when this fails) ---"
          . /etc/os-release; echo "distro=$PRETTY_NAME"
          dpkg-query -W -f='${Package} ${Version}\n' 'libasound2*' 2>/dev/null || true

          echo "--- launch ---"
          # No display in the container, so this exits at the X11 stage. That
          # is fine: it only gets there after the engine boots, so reaching
          # the local API listener proves the packaging is sound. Assert on
          # output rather than exit status.
          out=$(timeout 180 mimo-desktop --version 2>&1 || true)
          echo "$out" | tail -5
          case "$out" in
            *"Cannot find native binding"*)
              echo "FAIL: a native .node module would not load"; exit 1 ;;
          esac
          case "$out" in
            *"[mimo][api] listening on"*) ;;
            *) echo "FAIL: app never reached its local API server"; exit 1 ;;
          esac
          echo "--- OK ---"
          SMOKE
          cp "$(ls "$PWD"/smoke/*.deb)" "$PWD/smoke/mimo.deb"
          docker run --rm \
            -v "$PWD/smoke:/artifacts:ro" \
            -v "$PWD/smoke.sh:/smoke.sh:ro" \
            "${{ matrix.distro }}" bash /smoke.sh

  # Weekly upstream-drift alarm. The release tag is the upstream version
  # (see the release job), so comparing it to the version in this build is a
  # direct "has Xiaomi shipped something new" test.
  drift:
    needs: [build, test]
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mimo-ai-linux-x64
          path: dist

      - name: Compare against the newest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # One deb only — dpkg-deb -f takes a single file, and the glob
          # matches both arches.
          deb="$(find dist -name '*.deb' -type f | sort | head -1)"
          if [ -z "$deb" ]; then echo "no .deb found under dist/" >&2; exit 1; fi
          built="$(dpkg-deb -f "$deb" Version)"
          latest="$(gh release view --json tagName -q .tagName 2>/dev/null || true)"
          echo "built:    v$built"
          echo "released: ${latest:-<none>}"
          if [ "${latest#v}" = "$built" ]; then
            echo "upstream unchanged — nothing to do"
            exit 0
          fi
          echo "::notice::upstream moved to v$built (newest release is ${latest:-none})"
          gh issue create \
            --title "Upstream MiMo AI v$built available (newest release: ${latest:-none})" \
            --body "$(cat <<EOF
          The scheduled rebuild found a newer upstream version.

          - This build: \`v$built\`
          - Newest release: \`${latest:-none}\`

          See the run log for the full build output. If it looks healthy, cut a
          release by dispatching the workflow manually with \`make_release\`.
          EOF
          )" \
            || echo "::warning::could not open the drift issue"

  release:
    needs: [build, test, smoke]
    if: ${{ github.event.inputs.make_release == 'true' }}
    runs-on: ubuntu-latest
    # softprops/action-gh-release creates the tag + release through the
    # GITHUB_TOKEN, so this job needs write access to repo contents. Without
    # an explicit block it inherits the repo/org default, which may be
    # read-only and fail the publish with a 403.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      # Tag by the upstream version rather than the run number, so the tag is
      # the thing users compare against and the drift job can read it straight
      # off the newest release. Re-dispatching the same upstream version would
      # collide, so fall back to a run-numbered tag.
      - name: Choose the release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Pick ONE deb first: the glob matches both arches, and
          # `dpkg-deb -f a.deb b.deb Version` takes a single file, so expanding
          # it inline yields an empty version and an invalid tag.
          deb="$(find dist -name '*.deb' -type f | sort | head -1)"
          if [ -z "$deb" ]; then echo "no .deb found under dist/" >&2; exit 1; fi
          version="$(dpkg-deb -f "$deb" Version)"
          if [ -z "$version" ]; then echo "could not read Version from $deb" >&2; exit 1; fi
          tag="v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            tag="v${version}-run.${{ github.run_number }}"
            echo "v${version} already published; using $tag instead"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "MiMo AI (Linux, unofficial) ${{ steps.tag.outputs.version }}"
          files: dist/**/*
