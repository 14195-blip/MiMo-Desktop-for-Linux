name: Build MiMo AI (Linux)

on:
  workflow_dispatch:
    inputs:
      exe_url:
        description: "Installer URL (change only if Xiaomi's CDN path changes)"
        required: false
        default: "https://mimocode-cdn.xiaomimimo.com/mimocode/mimodesktopai/XiaomiMiMo-AI-latest-x64-setup.exe"
      electron_version:
        description: "Force a specific Electron version (blank = auto-detect from the exe)"
        required: false
        default: ""
      make_release:
        description: "Publish a GitHub Release with the built artifacts"
        type: boolean
        required: false
        default: false

  # The upstream installer URL is a `-latest-` pointer, so a new Xiaomi build
  # can land at any time. Rebuild weekly to catch upstream breakage early.
  # Scheduled runs build + test only: `make_release` has no value on a
  # schedule event, so the release job is skipped and publishing stays an
  # explicit human decision. A failure here is the drift alarm.
  schedule:
    # Mondays 04:37 UTC — off the hour, when cron load is lightest.
    - cron: "37 4 * * 1"

jobs:
  # Fast gate: type-checks the script and runs its inline unit tests. Keeps
  # regressions in the packaging logic (platform filters, path handling)
  # from reaching a published .deb — the arm64 release shipped x86-64
  # natives because nothing checked the arch.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Inline tests (also type-checks)
        run: deno test -A mimo-linux.ts

  build:
    # No arm64 runner needed: we only download pre-built Electron zips and
    # npm native modules for the target arch, we don't compile anything.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    outputs:
      version: ${{ steps.build.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install system tools
        run: |
          sudo apt-get update -y
          # p7zip-full is a transitional dummy package on Ubuntu 24.04+
          # ("noble", incl. ubuntu-latest) — it no longer installs a `7z`
          # binary, it just pulls in `7zip`, which installs `7zz` instead.
          # Install both (harmless if p7zip-full is a no-op) and symlink so
          # `7z` resolves either way, for tooling that expects it literally.
          sudo apt-get install -y p7zip-full 7zip curl unzip tar dpkg-dev
          if ! command -v 7z >/dev/null 2>&1 && command -v 7zz >/dev/null 2>&1; then
            sudo ln -sf "$(command -v 7zz)" /usr/local/bin/7z
          fi
          command -v 7z || command -v 7zz

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build ${{ matrix.arch }} (+ .deb)
        id: build
        env:
          # Empty on a `schedule` run (github.event.inputs only exists for
          # workflow_dispatch), so every input needs a shell-side default or
          # the scheduled build would pass --exe-url "" and die immediately.
          INPUT_EXE_URL: ${{ github.event.inputs.exe_url }}
          INPUT_ELECTRON: ${{ github.event.inputs.electron_version }}
        run: |
          set -euo pipefail
          EXE_URL="${INPUT_EXE_URL:-https://mimocode-cdn.xiaomimimo.com/mimocode/mimodesktopai/XiaomiMiMo-AI-latest-x64-setup.exe}"
          ELECTRON_VERSION="${INPUT_ELECTRON// /}"
          EXTRA_FLAGS=()
          if [ -n "$ELECTRON_VERSION" ]; then
            EXTRA_FLAGS+=(--electron "$ELECTRON_VERSION")
          fi
          deno run -A mimo-linux.ts \
            --exe-url "$EXE_URL" \
            --target-arch ${{ matrix.arch }} \
            --deb -y \
            "${EXTRA_FLAGS[@]}"

      - name: Archive portable build
        run: |
          set -euo pipefail
          OUTDIR=$(find . -maxdepth 1 -type d -name "*-linux-${{ matrix.arch }}" | head -n1)
          tar -czf "$(basename "$OUTDIR").tar.gz" "$OUTDIR"

      - uses: actions/upload-artifact@v4
        with:
          name: mimo-ai-linux-${{ matrix.arch }}
          path: |
            *-linux-${{ matrix.arch }}.tar.gz
            *.deb
          if-no-files-found: error

  release:
    needs: [build, test]
    if: ${{ github.event.inputs.make_release == 'true' }}
    runs-on: ubuntu-latest
    # softprops/action-gh-release creates the tag + release through the
    # GITHUB_TOKEN, so this job needs write access to repo contents. Without
    # an explicit block it inherits the repo/org default, which may be
    # read-only and fail the publish with a 403.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: mimo-ai-linux-${{ github.run_number }}
          name: "MiMo AI (Linux, unofficial) — run #${{ github.run_number }}"
          files: dist/**/*
